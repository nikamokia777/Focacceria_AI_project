<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Focacceria — PriceCheck</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="PriceCheck" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <style>
    :root {
      --bg: #f3f2ee;
      --card: #ffffff;
      --line: #e6e4df;
      --line-soft: #efede8;
      --head: #f8f7f4;
      --text: #1c1c1c;
      --muted: #8b8881;
      --dark: #1c1c1c;
      --green: #25d366;
      --green-dark: #1a9e4b;
      --green-soft: #eaf8ef;
      --red: #d64545;
      --red-soft: #fdf0ef;
      --radius: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); }
    body {
      color: var(--text);
      font-family: "Noto Sans Georgian", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }

    .muted { color: var(--muted); }
    .small { font-size: 11.5px; }
    .strong { font-weight: 600; }
    .big { font-size: 15px; }
    .mono { font-variant-numeric: tabular-nums; }
    .nowrap { white-space: nowrap; }
    .grow { flex: 1 1 auto; min-width: 0; }
    .hint { margin-top: 6px; }
    .ok-text { color: var(--green-dark); font-size: 12px; margin-top: 6px; }
    .error-text { color: var(--red); font-size: 12px; margin-top: 8px; }

    /* top bar */
    .topbar {
      background: #fff; border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 12px 18px; position: sticky; top: 0; z-index: 20;
    }
    .brand { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand .muted { font-weight: 400; }
    .topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .sync { font-size: 11px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; color: var(--muted); background: #fbfaf8; white-space: nowrap; }
    .sync-error { color: var(--red); border-color: #f1c9c6; background: var(--red-soft); }

    .main { max-width: 1320px; margin: 0 auto; padding: 22px 24px 60px; }

    /* tabs */
    .tabs {
      display: inline-flex; gap: 2px; background: #fff; border: 1px solid var(--line);
      border-radius: 12px; padding: 4px; margin-bottom: 16px; max-width: 100%; overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      position: relative; border: 0; background: transparent; border-radius: 8px;
      padding: 7px 18px; font-size: 13px; white-space: nowrap; color: var(--text);
    }
    .tab:hover { background: #f4f3ef; }
    .tab.on { background: var(--dark); color: #fff; }
    .badge {
      position: absolute; top: -3px; right: -1px; min-width: 16px; height: 16px; padding: 0 4px;
      border-radius: 999px; background: #e5484d; color: #fff; font-size: 10px; line-height: 16px; text-align: center; font-weight: 600;
    }

    /* cards & kpis */
    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
    .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
    .kpi { padding: 16px 18px; min-height: 76px; }
    .kpi-label { font-size: 10.5px; color: var(--muted); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .kpi-value { font-size: 21px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* toolbar & inputs */
    .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .toolbar.inner { padding: 12px; margin: 0; border-bottom: 1px solid var(--line); }
    .toolbar .input.grow { flex: 1 1 220px; }
    .toolbar select.input { flex: 0 1 230px; }
    .input {
      height: 36px; border: 1px solid var(--line); border-radius: 8px; background: #fff;
      padding: 0 11px; font-size: 13px; outline: none; min-width: 0;
    }
    .input:focus { border-color: #b9b6ae; }
    select.input { padding-right: 6px; }
    .row { display: flex; gap: 8px; }

    .btn-dark, .btn-outline, .btn-ghost, .btn-wa, .btn-danger-outline, .btn-green-outline {
      height: 36px; border-radius: 8px; padding: 0 16px; font-size: 13px; font-weight: 500;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
    }
    .btn-dark { background: var(--dark); color: #fff; border: 1px solid var(--dark); }
    .btn-dark:disabled { opacity: .5; cursor: default; }
    .btn-dark.wide { width: 100%; margin-top: 14px; }
    .btn-outline { background: #fff; border: 1px solid var(--line); }
    .btn-outline:hover { border-color: #c9c6be; }
    .btn-ghost { background: #fff; border: 1px solid var(--line); }
    .btn-ghost.small { height: 28px; padding: 0 10px; font-size: 12px; }
    .btn-wa { background: var(--green); color: #fff; border: 1px solid var(--green); }
    .btn-wa:hover { background: #20bd5b; }
    .btn-wa.small { height: 28px; padding: 0 10px; font-size: 12px; border-radius: 7px; }
    .btn-danger-outline { background: #fff; color: var(--red); border: 1px solid #f0b8b4; }
    .btn-green-outline { background: #fff; color: var(--green-dark); border: 1px solid #a9e3bf; }
    .link-btn { border: 0; background: none; color: var(--muted); font-size: 12px; padding: 6px 0 0; }
    .icon-btn { width: 30px; height: 28px; border-radius: 7px; border: 1px solid var(--line); background: #fff; font-size: 13px; }
    .icon-btn:hover { border-color: #c9c6be; }

    /* tables */
    .table-card { overflow: hidden; }
    .table-scroll { overflow-x: auto; }
    .table { width: 100%; border-collapse: collapse; }
    .table-card .table { min-width: 900px; }
    .table th {
      background: var(--head); text-align: left; font-weight: 400; color: var(--muted);
      font-size: 11px; padding: 11px 12px; border-bottom: 1px solid var(--line); white-space: nowrap;
    }
    .table td { padding: 11px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
    .table tr:last-child td { border-bottom: 0; }
    .table .c-n { width: 34px; }
    .table .c-act { width: 46px; text-align: right; }
    .table.mini td { padding: 7px 10px; font-size: 12px; }
    .pill { display: inline-block; font-size: 11px; padding: 2px 9px; border-radius: 999px; white-space: nowrap; font-weight: 500; }
    .tag { display: inline-block; margin-left: 6px; font-size: 10px; padding: 1px 6px; border-radius: 4px; background: #f0eee9; color: var(--muted); font-weight: 500; vertical-align: 1px; }
    .contact { white-space: nowrap; }
    .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--green); margin-left: 6px; vertical-align: 1px; }
    .empty { padding: 34px 16px; text-align: center; color: var(--muted); }

    /* supplier cards */
    .supplier-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
    .supplier { padding: 14px 16px; }
    .supplier-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
    .supplier-contact { color: #555; font-size: 12px; margin-bottom: 6px; }
    .supplier-products { color: var(--muted); font-size: 12px; }

    /* orders */
    .orders { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(320px, 1fr); gap: 14px; align-items: start; }
    .orders-scroll { max-height: calc(100vh - 230px); min-height: 300px; overflow-y: auto; }
    .order-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-bottom: 1px solid var(--line-soft); }
    .order-row.on { background: var(--green-soft); }
    .order-row-main { flex: 1 1 auto; min-width: 0; }
    .order-row-price { text-align: right; white-space: nowrap; }
    .round-btn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: #fff; font-size: 17px; line-height: 1; flex-shrink: 0; }
    .round-btn.on { background: var(--dark); border-color: var(--dark); color: #fff; font-size: 15px; }
    .order-panel { position: sticky; top: 64px; }
    .order-panel-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .order-panel-head .btn-danger-outline { height: 30px; font-size: 12px; padding: 0 12px; }
    .order-group { border-bottom: 1px solid var(--line); }
    .order-group-head { display: flex; justify-content: space-between; align-items: flex-start; padding: 12px 16px 6px; }
    .order-line { padding: 8px 16px 10px; border-top: 1px solid var(--line-soft); }
    .order-line-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .order-line-meta { display: flex; gap: 6px; align-items: center; margin: 2px 0 8px; flex-wrap: wrap; }
    .chip { font-size: 10.5px; background: #f0eee9; color: #666; border-radius: 4px; padding: 0 6px; }
    .chip.tg { background: #e7f2fc; color: #2a6db3; }
    .order-line-inputs { display: flex; gap: 6px; }
    .order-line-inputs .qty { width: 64px; text-align: center; }
    .order-line-inputs .unit { width: 52px; text-align: center; padding: 0 4px; }
    .x-btn { width: 26px; height: 26px; border-radius: 50%; border: 0; background: #fde4e2; color: var(--red); font-size: 15px; line-height: 1; flex-shrink: 0; }
    .order-group-actions { display: flex; flex-direction: column; align-items: stretch; gap: 8px; padding: 6px 16px 14px; }
    .sent-note { color: var(--green-dark); font-size: 12px; }
    .warn-note { color: #b26a00; font-size: 12px; }
    .order-total { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; }

    /* records (mistakes / history) */
    .records { display: flex; flex-direction: column; gap: 10px; }
    .record { padding: 14px 16px; }
    .record-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .status-pill { font-size: 11px; padding: 2px 10px; border-radius: 999px; white-space: nowrap; font-weight: 500; }
    .st-approved { background: #dff5e7; color: #136c36; }
    .st-rejected { background: #fde4e2; color: #a32e2e; }
    .st-resolved { background: #ecebe7; color: #5f5d58; }
    .st-received { background: #e2eefb; color: #24578f; }
    .reason { margin-top: 10px; background: var(--red-soft); border-left: 3px solid #ec8f88; border-radius: 6px; padding: 8px 12px; }
    .reason.empty-reason { color: var(--muted); font-style: italic; background: #f7f6f3; border-left-color: var(--line); }
    .received-line { margin-top: 8px; color: #24578f; }
    .bad-count { color: #b26a00; }
    .record-actions { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; margin-top: 12px; }
    .record-actions .sent-note { margin-right: auto; }
    .status-dot { font-size: 11px; }
    .s-ok { color: var(--green-dark); }
    .s-high { color: var(--red); }
    .s-low { color: #2a6db3; }
    .s-unknown { color: #b26a00; }
    .s-noprice { color: var(--muted); }
    .line-high td, .line-low td { background: #fffaf3; }

    .soon { padding: 56px 16px; text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; }
    .soon-icon { font-size: 34px; }

    /* modals */
    .modal-back { position: fixed; inset: 0; background: rgba(28, 28, 28, .35); display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; z-index: 50; }
    .modal { width: 100%; max-width: 620px; padding: 18px 20px 20px; box-shadow: 0 20px 50px rgba(0,0,0,.15); }
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .x-plain { border: 0; background: none; font-size: 22px; line-height: 1; color: var(--muted); padding: 0 4px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field.span2 { grid-column: span 2; }
    .field-label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 2px; }
    .modal-actions { display: flex; gap: 8px; margin-top: 18px; align-items: center; }
    .segmented { display: inline-flex; background: #f4f3ef; border-radius: 9px; padding: 3px; gap: 2px; margin-bottom: 14px; }
    .segmented button { border: 0; background: transparent; border-radius: 7px; padding: 6px 14px; font-size: 12.5px; }
    .segmented button.on { background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.08); font-weight: 600; }
    .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 8px; font-weight: 600; }
    .modal-head + .section-title { margin-top: 0; }
    .status-list { border: 1px solid var(--line); border-radius: 8px; }
    .status-row { display: flex; justify-content: space-between; padding: 7px 12px; border-bottom: 1px solid var(--line-soft); font-size: 12.5px; }
    .status-row:last-child { border-bottom: 0; }
    .status-row .ok-text, .status-row .error-text { margin: 0; font-weight: 600; }
    .help-list { padding-left: 18px; color: #555; display: flex; flex-direction: column; gap: 3px; }

    /* login */
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .login { width: 100%; max-width: 360px; padding: 22px; }
    .login-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; gap: 10px; }
    .login .input { width: 100%; }

    /* storage (Syrve stock) */
    .notice { padding: 10px 14px; margin-bottom: 12px; }
    .red-text { color: var(--red); }
    .table .r { text-align: right; }
    .table-card .table.stock-table { min-width: 980px; }
    .stock-table .row-low td { background: var(--red-soft); }
    .prio-pick { display: inline-flex; gap: 6px; }
    .prio-dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid transparent; opacity: .28; padding: 0; }
    .prio-dot:hover { opacity: .6; }
    .prio-dot.on { opacity: 1; border-color: var(--dark); }
    .p-red { background: #e5484d; }
    .p-yellow { background: #f5c518; }
    .p-cyan { background: #22c3d6; }
    .num-input { width: 82px; height: 32px; text-align: right; }
    .unit-label { display: inline-block; min-width: 26px; margin-left: 5px; text-align: left; color: var(--muted); font-size: 11.5px; }
    .corr-note { color: #9a6a00; margin-top: 3px; }
    .link-btn { border: 0; background: none; padding: 0; color: #2f6fd6; font-size: inherit; text-decoration: underline; }
    .link-select { height: 30px; max-width: 280px; margin-top: 4px; }
    .alarm-open, .alarm-low { background: #fde4e2; color: var(--red); }
    .alarm-approved { background: var(--green-soft); color: var(--green-dark); }
    .alarm-rejected { background: #f0eee9; color: var(--muted); }
    .table-foot { padding: 10px 14px; border-top: 1px solid var(--line-soft); }

    /* phones & tablets */
    @media (max-width: 1000px) {
      .supplier-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .orders { grid-template-columns: 1fr; }
      .order-panel { position: static; }
      .orders-scroll { max-height: 55vh; }
    }
    @media (max-width: 700px) {
      .main { padding: 14px 16px 50px; }
      .topbar { padding: 10px 16px; }
      .brand .muted { display: none; }
      .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .kpi { padding: 12px 14px; min-height: 0; }
      .kpi-value { font-size: 18px; }
      .supplier-grid { grid-template-columns: 1fr; }
      .toolbar select.input { flex: 1 1 45%; }
      .tab { padding: 7px 13px; }
      .form-grid { grid-template-columns: 1fr; }
      .field.span2 { grid-column: auto; }
      .modal-back { padding: 0; align-items: stretch; }
      .modal { border-radius: 0; min-height: 100%; max-width: none; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="/app.js"></script>
</body>
</html>
