<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Focacceria</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <script>
    // Telegram links open /#history or /#mistakes — send those straight to PriceCheck.
    if (location.hash && location.hash !== "#") location.replace("/pricecheck" + location.hash);
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/dashboard/app.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
  <script src="/dashboard/app.js" defer></script>
</head>
<body data-page="main">
  <!-- Login (same CEO password as PriceCheck) -->
  <section id="login" class="login" hidden>
    <form id="loginForm" class="login-card">
      <h1 data-t="app_name">Focacceria</h1>
      <label>
        <span data-t="password">Password</span>
        <input type="password" id="loginPass" autocomplete="current-password" required>
      </label>
      <p id="loginErr" class="err" hidden></p>
      <button type="submit" class="btn primary" data-t="login">Log in</button>
    </form>
  </section>

  <!-- Main overview -->
  <div id="app" hidden>
    <header class="topbar main-top">
      <div class="topbar-left">
        <h1><span data-t="app_name">Focacceria</span> · <span data-t="main">Main</span></h1>
      </div>
      <div class="topbar-right">
        <nav class="nav-btns">
          <a class="nav-btn" href="/dashboard/">▦ <span data-t="dashboard">Dashboard</span></a>
          <a class="nav-btn" href="/pricecheck">✓ PriceCheck</a>
        </nav>
        <button class="lang" id="langBtn" type="button">EN</button>
        <button class="btn ghost small" id="logoutBtn" type="button" data-t="logout">Log out</button>
      </div>
    </header>
    <main id="view" class="view"></main>
  </div>

  <div id="tooltip" class="tooltip" hidden></div>
  <div id="toast" class="toast" hidden></div>
</body>
</html>
