      const t = TRANSLATIONS[lang];
      const [tab, setTab] = useState("scan");
      const [basePrices, setBasePrices] = useState(() => {
        try {
          const saved = localStorage.getItem("pricecheck_basePrices");
          if (saved) { const parsed = JSON.parse(saved); if (Array.isArray(parsed) && parsed.length) return parsed; }
        } catch {}
        return [];
      });
      const [imageFile, setImageFile] = useState(null);
      const [imagePreview, setImagePreview] = useState(null);
      const [scanning, setScanning] = useState(false);
      const [results, setResults] = useState(null);
      const [telegramConfig, setTelegramConfig] = useState(() => {
        try {
          const saved = localStorage.getItem("pricecheck_telegramConfig");
          if (saved) return JSON.parse(saved);
        } catch {}
        return { botToken: "", chatId: "" };
      });

      // Persist base prices and Telegram settings so a page reload doesn't lose them
      useEffect(() => {
        try { localStorage.setItem("pricecheck_basePrices", JSON.stringify(basePrices)); } catch {}
      }, [basePrices]);
      useEffect(() => {
        try { localStorage.setItem("pricecheck_telegramConfig", JSON.stringify(telegramConfig)); } catch {}
      }, [telegramConfig]);

      const [sending, setSending] = useState(false);
      const [sentOk, setSentOk] = useState(false);
      const [editingPrice, setEditingPrice] = useState(null);
      const [dragOver, setDragOver] = useState(false);
      const [newProduct, setNewProduct] = useState({ name: "", code: "", price: "", unit: "", supplier: "" });
      const [addError, setAddError] = useState(false);
      const [scanError, setScanError] = useState(null);
      const [filterSupplier, setFilterSupplier] = useState("all");

      const fileRef = useRef();

      // ── Image handling ──────────────────────────────────────────────────────
      const handleFile = useCallback((file) => {
        if (!file || (!file.type.startsWith("image/") && file.type !== "application/pdf")) return;
        setImageFile(file); setResults(null); setSentOk(false); setScanError(null);
        const reader = new FileReader();
        reader.onload = (e) => setImagePreview(e.target.result);
        reader.readAsDataURL(file);
      }, []);

      const onDrop = (e) => { e.preventDefault(); setDragOver(false); handleFile(e.dataTransfer.files[0]); };

// ── AI Scan ─────────────────────────────────────────────────────────────
      const runScan = async () => {
        if (!imageFile) return;
        setScanning(true); setScanError(null); setResults(null);
        try {
          const base64 = await new Promise((res, rej) => {
            const r = new FileReader();
            r.onload = () => {
              try {
                const result = r.result;
                if (typeof result !== "string") { rej(new Error("Could not read file")); return; }
                const comma = result.indexOf(",");
                const b64 = comma >= 0 ? result.slice(comma + 1) : result;
                if (!b64) { rej(new Error("File appears to be empty")); return; }
                res(b64);
              } catch (e) { rej(e); }
            };
            r.onerror = () => rej(new Error("Could not read the file. Please try again."));
            r.readAsDataURL(imageFile);
          });

          // Clean up the media type — browsers sometimes append params or leave it blank for PDFs
          let mediaType = (imageFile.type || "").split(";")[0].trim();
          if (!mediaType) {
            const nm = (imageFile.name || "").toLowerCase();
            if (nm.endsWith(".pdf")) mediaType = "application/pdf";
            else if (nm.endsWith(".png")) mediaType = "image/png";
            else if (nm.endsWith(".webp")) mediaType = "image/webp";
            else mediaType = "image/jpeg";
          }

          // Retry helper: transient failures (Gemini overload, network blips, timeouts)
          // are the main cause of intermittent errors, so try up to 3 times.
          const fetchWithRetry = async (attempts) => {
            let lastErr;
            for (let i = 0; i < attempts; i++) {
              try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 45000); // 45s timeout
                const resp = await fetch("/api/scan-invoice", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ imageBase64: base64, mediaType }),
                  signal: controller.signal,
                });
                clearTimeout(timeout);
                // Read as text first — calling resp.json() directly throws a cryptic
                // error on Safari if the server ever returns non-JSON (e.g. a gateway
                // error page), so we parse it ourselves and get a clear message instead.
                const rawText = await resp.text();
                let d;
                try {
                  d = JSON.parse(rawText);
                } catch {
                  throw new Error(`Server returned an unexpected response (status ${resp.status}). Please try again.`);
                }
                if (resp.ok) return d;
                // Retry on transient server/overload errors; fail fast on others
                const msg = (d.error || "").toLowerCase();
                const transient = resp.status === 429 || resp.status === 503 || resp.status >= 500 ||
                  msg.includes("overload") || msg.includes("high demand") || msg.includes("try again") || msg.includes("quota");
                lastErr = new Error(d.error || "Scan failed");
                if (!transient) throw lastErr;
              } catch (e) {
                lastErr = e.name === "AbortError" ? new Error("Scan timed out. Please try again.") : e;
              }
              // wait before retrying (0.8s, then 2s)
              if (i < attempts - 1) await new Promise(r => setTimeout(r, i === 0 ? 800 : 2000));
            }
            throw lastErr;
          };

          const data = await fetchWithRetry(3);
          const extracted = data.items || [];
          const matched = extracted.map(item => {
            const namesToTry = [item.name, item.nameKa, item.nameEn].filter(Boolean).map(n => n.toLowerCase());

            // Match by code first (most reliable), then by name
            const match = basePrices.find(b => {
              if (item.code && b.code && String(item.code).trim() === String(b.code).trim()) return true;
              const baseName = b.name.toLowerCase();
              const baseNameRs = (b.nameRs || "").toLowerCase();
              return namesToTry.some(n => baseName.includes(n) || n.includes(baseName) || (baseNameRs && (baseNameRs.includes(n) || n.includes(baseNameRs))));
            });

            const displayName = item.nameKa && item.nameKa !== item.name
              ? `${item.nameKa} (${item.name})`
              : item.name;

            const change = match ? pctChange(match.basePrice, item.price) : null;
            return { ...item, name: displayName, basePrice: match?.basePrice ?? null, supplier: match?.supplier ?? null, change, status: match ? statusOf(change) : "unknown", correctedPrice: item.price };
          });
          setResults(matched);
        } catch (err) {
          setScanError(err.message && err.message !== "Scan failed" ? err.message : t.scanErrorDefault);
        } finally {
          setScanning(false);
        }
      };

      const updateCorrected = (idx, val) => {
        setResults(prev => prev.map((r, i) => {
          if (i !== idx) return r;
          const price = parseFloat(val) || r.correctedPrice;
          const change = r.basePrice ? pctChange(r.basePrice, price) : null;
          return { ...r, correctedPrice: price, change, status: r.basePrice ? statusOf(change) : "unknown" };
        }));
      };

      // ── Telegram ────────────────────────────────────────────────────────────
      const buildMessage = () => {
        if (!results) return "";
        const date = new Date().toLocaleString();
        const flags = results.filter(r => r.status === "high" || r.status === "low");
        const ok = results.filter(r => r.status === "ok");
        const unknown = results.filter(r => r.status === "unknown");
        let msg = `🧾 *${t.msgTitle}* — ${date}\n\n`;
        if (flags.length) {
          msg += `⚠️ *${t.msgAlerts}*\n`;
          flags.forEach(r => {
            const arrow = r.status === "high" ? "🔴 ▲" : "🟢 ▼";
            const sup = r.supplier ? ` [${r.supplier}]` : "";
            msg += `${arrow} ${r.name}${sup}: ${r.correctedPrice.toFixed(2)} (${t.base}: ${r.basePrice?.toFixed(2)}, ${formatPct(r.change)})\n`;
          });
          msg += "\n";
        }
        if (ok.length) {
          msg += `✅ *${t.msgWithinRange}*\n`;
          ok.forEach(r => { msg += `• ${r.name}: ${r.correctedPrice.toFixed(2)} ${formatPct(r.change)}\n`; });
          msg += "\n";
        }
        if (unknown.length) {
          msg += `❓ *${t.msgNew}*\n`;
          unknown.forEach(r => { msg += `• ${r.name}: ${r.correctedPrice.toFixed(2)} ${r.unit}\n`; });
        }
        msg += `\n_${t.msgFooter}_`;
        return msg;
      };

      const sendToTelegram = async () => {
        const { botToken, chatId } = telegramConfig;
        if (!botToken || !chatId) { alert(t.setTelegramAlert); setTab("settings"); return; }
        setSending(true);
        try {
          const res = await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ chat_id: chatId, text: buildMessage(), parse_mode: "Markdown" })
          });
          const d = await res.json();
          if (d.ok) setSentOk(true); else alert(t.telegramError + d.description);
        } catch { alert(t.sendFailed); } finally { setSending(false); }
      };

      // ── Base price editing ──────────────────────────────────────────────────
      const saveEdit = () => {
        if (!editingPrice) return;
        setBasePrices(prev => prev.map(p => p.id === editingPrice.id ? editingPrice : p));
        setEditingPrice(null);
      };
      const addProduct = () => {
        const name = newProduct.name.trim();
        const price = parseFloat(newProduct.price);
        if (!name || isNaN(price) || price <= 0) { setAddError(true); return; }
        const newId = Math.max(...basePrices.map(p => p.id), 0) + 1;
        setBasePrices(prev => [...prev, {
          id: newId,
          name,
          code: newProduct.code.trim(),
          basePrice: price,
          unit: newProduct.unit.trim() || "unit",
          supplier: newProduct.supplier.trim(),
          isAlt: false,
        }]);
        setNewProduct({ name: "", code: "", price: "", unit: "", supplier: "" });
        setAddError(false);
      };
      const removeProduct = (id) => setBasePrices(prev => prev.filter(p => p.id !== id));

      const suppliers = ["all", ...Array.from(new Set(basePrices.map(p => p.supplier).filter(Boolean)))];
      const filteredPrices = filterSupplier === "all" ? basePrices : basePrices.filter(p => p.supplier === filterSupplier);

      return (
        <div style={{ minHeight: "100vh", background: "#0d0d0d", color: "#e8e0d5", fontFamily: "'DM Mono', monospace", paddingBottom: 60 }}>
          {/* Header */}
          <div style={{ borderBottom: "1px solid #1e1e1e", padding: "24px 24px 0", background: "linear-gradient(180deg,#111 0%,#0d0d0d 100%)", position: "sticky", top: 0, zIndex: 10 }}>
            <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", gap: 12, marginBottom: 20 }}>
              <div style={{ display: "flex", alignItems: "baseline", gap: 12 }}>
                <span style={{ fontSize: 22, fontFamily: "'Playfair Display',serif", fontWeight: 900, letterSpacing: -1 }}>{t.appName}<span style={{ color: "#c8a96e" }}>{t.appNameAccent}</span></span>
                <span style={{ fontSize: 10, color: "#555", letterSpacing: 3, textTransform: "uppercase" }}>{t.tagline}</span>
              </div>
              <button onClick={() => setLang(l => l === "en" ? "ka" : "en")} style={{ background: "#1a1a1a", border: "1px solid #2a2a2a", borderRadius: 20, color: "#c8a96e", fontSize: 12, padding: "5px 14px", cursor: "pointer", fontFamily: "inherit", letterSpacing: 1, whiteSpace: "nowrap" }}>
                🌐 {lang === "en" ? "ქართული" : "English"}
              </button>
            </div>
            <div style={{ display: "flex", gap: 2 }}>
              {[["scan",t.tabScan],["prices",t.tabPrices],["settings",t.tabSettings]].map(([id,label]) => (
                <button key={id} onClick={() => setTab(id)} style={{ background: tab===id?"#1a1a1a":"transparent", border:"none", borderBottom: tab===id?"2px solid #c8a96e":"2px solid transparent", color: tab===id?"#e8e0d5":"#555", padding:"8px 16px", fontSize:12, letterSpacing:1, cursor:"pointer", fontFamily:"inherit", transition:"all .2s" }}>{label}</button>
              ))}
            </div>
          </div>

          <div style={{ maxWidth: 680, margin: "0 auto", padding: "24px 16px" }}>

            {/* ── SCAN TAB ── */}
            {tab === "scan" && (
              <div className="slide-up">
                <div onDragOver={e=>{e.preventDefault();setDragOver(true);}} onDragLeave={()=>setDragOver(false)} onDrop={onDrop} onClick={()=>fileRef.current.click()}
                  style={{ border:`2px dashed ${dragOver?"#c8a96e":imagePreview?"#2d6b4a":"#2a2a2a"}`, borderRadius:8, padding:imagePreview?0:"48px 24px", textAlign:"center", cursor:"pointer", background:dragOver?"#1a1600":"#111", transition:"all .2s", overflow:"hidden", marginBottom:16 }}>
                  {imagePreview
                    ? imageFile?.type === "application/pdf"
                      ? <div style={{padding:"32px 24px",textAlign:"center"}}><div style={{fontSize:48,marginBottom:12}}>📋</div><div style={{color:"#5dde8d",fontSize:14}}>{imageFile.name}</div><div style={{color:"#555",fontSize:11,marginTop:4}}>PDF ready to scan</div></div>
                      : <img src={imagePreview} alt="Invoice" style={{ width:"100%", display:"block", borderRadius:6, maxHeight:320, objectFit:"contain", background:"#0a0a0a" }} />
                    : <><div style={{fontSize:36,marginBottom:12}}>📄</div><div style={{color:"#888",fontSize:13}}>{t.dropHint}</div><div style={{color:"#444",fontSize:11,marginTop:6}}>{t.fileTypes}</div></>}
                </div>
                <input ref={fileRef} type="file" accept="image/*,application/pdf" style={{display:"none"}} onChange={e=>handleFile(e.target.files[0])} />

                {imagePreview && !results && (
                  <button onClick={runScan} disabled={scanning} style={{ width:"100%", padding:"14px", marginBottom:16, background:scanning?"#1a1a1a":"linear-gradient(135deg,#c8a96e,#a07840)", border:"none", borderRadius:6, color:scanning?"#555":"#0d0d0d", fontSize:13, fontWeight:500, letterSpacing:2, textTransform:"uppercase", cursor:"pointer", fontFamily:"inherit" }}>
                    {scanning
                      ? <span style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8}}><span style={{display:"inline-block",width:14,height:14,border:"2px solid #555",borderTopColor:"#c8a96e",borderRadius:"50%",animation:"spin 0.8s linear infinite"}}/> {t.scanning}</span>
                      : t.scanBtn}
                  </button>
                )}

                {scanError && <div style={{background:"#2a1010",border:"1px solid #5a2020",borderRadius:6,padding:14,color:"#ff6b6b",fontSize:13,marginBottom:16}}>⚠ {scanError}</div>}

                {results && (
                  <div className="slide-up">
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                      <span style={{fontSize:11,letterSpacing:2,color:"#888",textTransform:"uppercase"}}>{results.length} {t.itemsExtracted}</span>
                      <button onClick={()=>{setResults(null);setImagePreview(null);setImageFile(null);setSentOk(false);}} style={{background:"none",border:"1px solid #2a2a2a",borderRadius:4,color:"#555",fontSize:11,padding:"4px 10px",cursor:"pointer",fontFamily:"inherit"}}>{t.reset}</button>
                    </div>
                    <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:20}}>
                      {results.map((r,i) => {
                        const s = statusStyle(r.status);
                        return (
                          <div key={i} style={{background:s.bg,border:`1px solid ${s.border}`,borderRadius:6,padding:"12px 14px"}}>
                            <div style={{display:"grid",gridTemplateColumns:"1fr auto auto",gap:8,alignItems:"center"}}>
                              <div>
                                <div style={{fontSize:13,color:"#e8e0d5",marginBottom:2}}>{r.name}</div>
                                <div style={{fontSize:11,color:"#555"}}>
                                  {r.basePrice && <>{t.base}: {r.basePrice.toFixed(2)} / {r.unit}</>}
                                  {r.supplier && <span style={{color:"#888",marginLeft:8}}>· {r.supplier}</span>}
                                </div>
                              </div>
                              <input type="number" step="0.01" value={r.correctedPrice} onChange={e=>updateCorrected(i,e.target.value)}
                                style={{background:"#0d0d0d",border:`1px solid ${s.border}`,borderRadius:4,color:"#e8e0d5",fontSize:14,fontWeight:500,width:80,textAlign:"right",padding:"4px 6px"}} />
                              <div style={{color:s.text,fontSize:13,minWidth:60,textAlign:"right"}}>
                                {r.change!==null ? <>{s.icon} {formatPct(r.change)}</> : <span style={{color:"#555"}}>{s.icon}</span>}
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                    <div style={{display:"flex",gap:16,marginBottom:20,fontSize:11,color:"#555"}}>
                      <span>🔴 {t.legendHigh}</span><span>🔵 {t.legendLow}</span><span>✅ {t.legendOk}</span><span>❓ {t.legendNew}</span>
                    </div>
                    {sentOk
                      ? <div style={{background:"#1a3a2a",border:"1px solid #2d6b4a",borderRadius:6,padding:14,textAlign:"center",color:"#5dde8d",fontSize:13}}>{t.sentOk}</div>
                      : <button onClick={sendToTelegram} disabled={sending} style={{width:"100%",padding:14,background:sending?"#1a1a1a":"#1a2f1a",border:"1px solid #2d6b4a",borderRadius:6,color:sending?"#555":"#5dde8d",fontSize:13,letterSpacing:2,textTransform:"uppercase",cursor:"pointer",fontFamily:"inherit"}}>
                          {sending?t.sendingBtn:t.sendBtn}
                        </button>}
                    <details style={{marginTop:16}}>
                      <summary style={{cursor:"pointer",fontSize:11,color:"#555",letterSpacing:1}}>{t.previewMsg}</summary>
                      <pre style={{marginTop:8,background:"#111",border:"1px solid #1e1e1e",borderRadius:6,padding:14,fontSize:11,color:"#888",whiteSpace:"pre-wrap",wordBreak:"break-word"}}>{buildMessage()}</pre>
                    </details>
                  </div>
                )}
              </div>
            )}

            {/* ── BASE PRICES TAB ── */}
            {tab === "prices" && (
              <div className="slide-up">

                {/* Add Product form */}
                <div style={{background:"#111",border:"1px solid #2a2a2a",borderRadius:8,padding:16,marginBottom:16}}>
                  <div style={{fontSize:11,color:"#c8a96e",letterSpacing:2,textTransform:"uppercase",marginBottom:12}}>{t.addProductTitle}</div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:10}}>
                    <input value={newProduct.name} onChange={e=>{setNewProduct(v=>({...v,name:e.target.value}));setAddError(false);}} placeholder={t.nameLabel}
                      style={{flex:"2 1 160px",background:"#0d0d0d",border:`1px solid ${addError && !newProduct.name.trim() ? "#8b3030" : "#2a2a2a"}`,borderRadius:6,color:"#e8e0d5",padding:"8px 10px",fontSize:13,fontFamily:"inherit"}} />
                    <input value={newProduct.code} onChange={e=>setNewProduct(v=>({...v,code:e.target.value}))} placeholder={t.codePh}
                      style={{flex:"1 1 120px",background:"#0d0d0d",border:"1px solid #2a2a2a",borderRadius:6,color:"#e8e0d5",padding:"8px 10px",fontSize:13,fontFamily:"inherit"}} />
                    <input type="number" step="0.01" value={newProduct.price} onChange={e=>{setNewProduct(v=>({...v,price:e.target.value}));setAddError(false);}} placeholder={t.pricePh}
                      style={{flex:"1 1 90px",background:"#0d0d0d",border:`1px solid ${addError && !(parseFloat(newProduct.price)>0) ? "#8b3030" : "#2a2a2a"}`,borderRadius:6,color:"#e8e0d5",padding:"8px 10px",fontSize:13,fontFamily:"inherit"}} />
                  </div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                    <input value={newProduct.unit} onChange={e=>setNewProduct(v=>({...v,unit:e.target.value}))} placeholder={t.unitPh}
                      style={{flex:"1 1 100px",background:"#0d0d0d",border:"1px solid #2a2a2a",borderRadius:6,color:"#e8e0d5",padding:"8px 10px",fontSize:13,fontFamily:"inherit"}} />
                    <input value={newProduct.supplier} onChange={e=>setNewProduct(v=>({...v,supplier:e.target.value}))} placeholder={t.supplierPh}
                      style={{flex:"1 1 140px",background:"#0d0d0d",border:"1px solid #2a2a2a",borderRadius:6,color:"#e8e0d5",padding:"8px 10px",fontSize:13,fontFamily:"inherit"}} />
                    <button onClick={addProduct} style={{flex:"1 1 140px",background:"linear-gradient(135deg,#c8a96e,#a07840)",border:"none",borderRadius:6,color:"#0d0d0d",fontSize:12,fontWeight:500,padding:"8px 16px",cursor:"pointer",fontFamily:"inherit",letterSpacing:1}}>
                      {t.addProductBtn}
                    </button>
                  </div>
                  {addError && (
                    <div style={{marginTop:8,fontSize:12,color:"#ff6b6b"}}>{t.codeRequired}</div>
                  )}
                </div>

                {/* Supplier filter */}
                {suppliers.length > 2 && (
                  <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}}>
                    {suppliers.map(s => (
                      <button key={s} onClick={()=>setFilterSupplier(s)} style={{background:filterSupplier===s?"#1a2a1a":"#111",border:`1px solid ${filterSupplier===s?"#2d6b4a":"#1e1e1e"}`,borderRadius:20,color:filterSupplier===s?"#5dde8d":"#555",fontSize:11,padding:"4px 12px",cursor:"pointer",fontFamily:"inherit"}}>
                        {s === "all" ? t.allSuppliers : s}
                      </button>
                    ))}
                  </div>
                )}

                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                  <span style={{fontSize:11,color:"#555",letterSpacing:2,textTransform:"uppercase"}}>{filteredPrices.length} {t.products}</span>
                </div>

                {filteredPrices.length === 0 && (
                  <div style={{textAlign:"center",color:"#555",fontSize:13,padding:"32px 16px"}}>{t.noProductsYet}</div>
                )}


                <div style={{display:"flex",flexDirection:"column",gap:6}}>
                  {filteredPrices.map(p => (
                    <div key={p.id} style={{background:"#111",border:"1px solid #1e1e1e",borderRadius:6,padding:"10px 14px"}}>
                      {editingPrice?.id === p.id ? (
                        <div style={{display:"flex",flexWrap:"wrap",gap:6,alignItems:"center"}}>
                          <input value={editingPrice.name} onChange={e=>setEditingPrice(v=>({...v,name:e.target.value}))} placeholder={t.productNamePh} style={{flex:"2 1 120px",background:"#0d0d0d",border:"1px solid #333",borderRadius:4,color:"#e8e0d5",padding:"4px 8px",fontSize:13,fontFamily:"inherit"}} />
                          <input value={editingPrice.code||""} onChange={e=>setEditingPrice(v=>({...v,code:e.target.value}))} placeholder={t.codePh} style={{flex:"1 1 90px",background:"#0d0d0d",border:"1px solid #333",borderRadius:4,color:"#e8e0d5",padding:"4px 8px",fontSize:13,fontFamily:"inherit"}} />
                          <input value={editingPrice.supplier||""} onChange={e=>setEditingPrice(v=>({...v,supplier:e.target.value}))} placeholder={t.supplierPh} style={{flex:"1 1 80px",background:"#0d0d0d",border:"1px solid #333",borderRadius:4,color:"#e8e0d5",padding:"4px 8px",fontSize:13,fontFamily:"inherit"}} />
                          <input value={editingPrice.unit} onChange={e=>setEditingPrice(v=>({...v,unit:e.target.value}))} placeholder={t.unitPh} style={{width:50,background:"#0d0d0d",border:"1px solid #333",borderRadius:4,color:"#e8e0d5",padding:"4px 8px",fontSize:13,fontFamily:"inherit"}} />
                          <input type="number" step="0.01" value={editingPrice.basePrice} onChange={e=>setEditingPrice(v=>({...v,basePrice:parseFloat(e.target.value)||0}))} style={{width:80,background:"#0d0d0d",border:"1px solid #c8a96e",borderRadius:4,color:"#e8e0d5",padding:"4px 8px",fontSize:13,textAlign:"right",fontFamily:"inherit"}} />
                          <button onClick={saveEdit} style={{background:"#c8a96e",border:"none",borderRadius:4,color:"#0d0d0d",padding:"4px 10px",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>✓</button>
                        </div>
                      ) : (
                        <div style={{display:"flex",alignItems:"center",gap:10}}>
                          <div style={{flex:2}}>
                            <div style={{fontSize:13}}>{p.name}</div>
                            <div style={{fontSize:11,color:"#555",marginTop:2,display:"flex",gap:8,flexWrap:"wrap"}}>
                              {p.supplier && <span>🏭 {p.supplier}</span>}
                              {p.code && <span style={{color:"#444"}}>#{p.code}</span>}
                              {p.isAlt && <span style={{color:"#c8a96e",fontSize:10,border:"1px solid #c8a96e",borderRadius:3,padding:"1px 5px"}}>ALT</span>}
                            </div>
                          </div>
                          <span style={{fontSize:11,color:"#555"}}>/{p.unit}</span>
                          <span style={{fontSize:14,color:"#c8a96e",minWidth:60,textAlign:"right"}}>{p.basePrice.toFixed(2)}</span>
                          <button onClick={()=>setEditingPrice({...p})} style={{background:"none",border:"1px solid #2a2a2a",borderRadius:4,color:"#888",fontSize:11,padding:"3px 8px",cursor:"pointer",fontFamily:"inherit"}}>{t.edit}</button>
                          <button onClick={()=>removeProduct(p.id)} style={{background:"none",border:"none",color:"#444",fontSize:14,padding:"0 4px",cursor:"pointer"}}>✕</button>
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* ── SETTINGS TAB ── */}
            {tab === "settings" && (
              <div className="slide-up">
                <div style={{background:"#111",border:"1px solid #1e1e1e",borderRadius:8,padding:20,marginBottom:16}}>
                  <div style={{fontSize:11,color:"#c8a96e",letterSpacing:2,textTransform:"uppercase",marginBottom:16}}>{t.telegramConfigTitle}</div>
                  {[[t.botToken,"botToken","110201543:AAHdqTcvCH..."],[t.chatId,"chatId","-1001234567890"]].map(([label,key,ph]) => (
                    <div key={key} style={{marginBottom:14}}>
                      <label style={{display:"block",fontSize:11,color:"#555",letterSpacing:1,marginBottom:6}}>{label}</label>
                      <input type="text" placeholder={ph} value={telegramConfig[key]} onChange={e=>setTelegramConfig(v=>({...v,[key]:e.target.value}))}
                        style={{width:"100%",background:"#0d0d0d",border:"1px solid #2a2a2a",borderRadius:6,color:"#e8e0d5",padding:"10px 12px",fontSize:13,fontFamily:"inherit"}} />
                    </div>
                  ))}
                  <div style={{fontSize:11,color:"#444",lineHeight:1.8,marginTop:16,borderTop:"1px solid #1e1e1e",paddingTop:14}}>
                    <strong style={{color:"#666"}}>{t.howToSetup}</strong><br/>
                    {t.step1}<br/>
                    {t.step2}<br/>
                    {t.step3}<br/>
                    {t.step4}
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  <script>
    // Minimal service worker (registered from an inline blob) so Chrome treats this as an installable PWA.
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', e => self.skipWaiting());
        self.addEventListener('activate', e => self.clients.claim());
        self.addEventListener('fetch', e => {
          e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
        });
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(blob);
      navigator.serviceWorker.register(swUrl).catch(() => {});
    }
  </script>
</body>
</html>
